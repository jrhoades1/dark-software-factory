<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Council Report</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    color: #1a1a2e;
    background: #f8f9fa;
    padding: 2rem;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    padding: 2rem 2.5rem;
  }

  .header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }

  .header .subtitle {
    font-size: 0.9rem;
    opacity: 0.7;
  }

  .question-box {
    background: #f0f4ff;
    border-left: 4px solid #3498db;
    padding: 1.25rem 1.5rem;
    margin: 1.5rem 2rem;
    border-radius: 0 8px 8px 0;
    font-size: 0.95rem;
  }

  .question-box h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #3498db;
    margin-bottom: 0.5rem;
  }

  .verdict {
    padding: 1.5rem 2rem;
  }

  .verdict h2 {
    font-size: 1.15rem;
    color: #1a1a2e;
    margin: 1.5rem 0 0.75rem;
    padding-bottom: 0.25rem;
    border-bottom: 2px solid #e8e8e8;
  }

  .verdict h2:first-child { margin-top: 0; }

  .verdict p, .verdict li {
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
  }

  .verdict ul { padding-left: 1.5rem; }

  .divider {
    height: 1px;
    background: #e8e8e8;
    margin: 0 2rem;
  }

  details {
    margin: 0.5rem 2rem;
  }

  summary {
    cursor: pointer;
    padding: 0.75rem 0;
    font-size: 0.95rem;
    user-select: none;
    list-style: none;
  }

  summary::-webkit-details-marker { display: none; }

  summary::before {
    content: "\25B6";
    display: inline-block;
    margin-right: 0.5rem;
    font-size: 0.7rem;
    transition: transform 0.2s;
    color: #999;
  }

  details[open] > summary::before { transform: rotate(90deg); }

  .advisor-content, .review-content {
    padding: 0.75rem 0 1rem;
    font-size: 0.9rem;
    color: #444;
  }

  .advisor-icon {
    margin-right: 0.25rem;
  }

  .advisor-section {
    border-bottom: 1px solid #f0f0f0;
  }

  .advisor-section:last-child { border-bottom: none; }

  .review-item {
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #f0f0f0;
  }

  .review-item:last-child { border-bottom: none; }

  .review-item h4 {
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 0.25rem;
  }

  .mapping {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid #f0f0f0;
  }

  .section-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #999;
    padding: 1.25rem 2rem 0;
  }

  .footer {
    background: #f8f9fa;
    padding: 1rem 2rem;
    font-size: 0.75rem;
    color: #999;
    text-align: center;
    border-top: 1px solid #e8e8e8;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>LLM Council Report</h1>
    <div class="subtitle">5 advisors &middot; anonymous peer review &middot; synthesized verdict</div>
  </div>

  <div class="question-box">
    <h2>Question</h2>
    <p>{{QUESTION}}</p>
  </div>

  <div class="verdict">
    {{VERDICT}}
  </div>

  <div class="divider"></div>
  <p class="section-label">Advisor Responses</p>

  {{ADVISOR_SECTIONS}}

  <div class="divider"></div>

  {{REVIEW_SECTION}}

  <div class="footer">
    Generated {{TIMESTAMP}} &middot; {{QUESTION_SHORT}}
  </div>

</div>
</body>
</html>
